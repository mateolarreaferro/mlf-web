<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body { margin: 0; width: 260px; padding: 16px 18px 18px; font: 13px/1.5 Inter, system-ui, sans-serif; background: #f4f3ee; color: #1b1d1b; }
      h1 { margin: 0 0 2px; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
      p { margin: 0 0 14px; color: #5d625e; }
      .row { display: grid; grid-template-columns: 78px 1fr 46px; align-items: center; gap: 10px; height: 32px; }
      .label { color: #5d625e; }
      input[type=range] { width: 100%; accent-color: #1b1d1b; }
      select { width: 100%; font: inherit; border: 0; background: #e8e7e1; border-radius: 999px; padding: 4px 10px; }
      .switch { grid-column: 2 / 4; justify-self: start; border: 0; border-radius: 999px; padding: 4px 14px; font: inherit; cursor: pointer; background: #e8e7e1; color: #1b1d1b; }
      .switch[aria-pressed="true"] { background: #1b1d1b; color: #f4f3ee; }
      .value { color: #5d625e; font-variant-numeric: tabular-nums; }
      a { color: #1a3a2a; }
      .foot { margin-top: 12px; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Periphery</h1>
    <p>Breathe with the circle in the corner: in as it grows, out as it shrinks.</p>
    <div class="row"><span class="label">show</span><button class="switch" id="on" aria-pressed="true">on</button></div>
    <div class="row">
      <span class="label">corner</span>
      <select id="corner" style="grid-column: 2 / 4">
        <option value="bottom-right">bottom right</option>
        <option value="bottom-left">bottom left</option>
        <option value="top-right">top right</option>
        <option value="top-left">top left</option>
      </select>
    </div>
    <div class="row"><span class="label">breaths</span><input id="perMinute" type="range" min="3" max="12" step="0.5" /><span class="value" id="perMinuteV"></span></div>
    <div class="row"><span class="label">size</span><input id="size" type="range" min="48" max="140" step="4" /><span class="value" id="sizeV"></span></div>
    <div class="row"><span class="label">opacity</span><input id="opacity" type="range" min="0.3" max="1" step="0.05" /><span class="value" id="opacityV"></span></div>
    <p class="foot">Made by Mateo Larrea Ferro. The piece: <a href="https://mateolarreaferro.com/?project=periphery" target="_blank">mateolarreaferro.com</a></p>
    <script src="breath.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
