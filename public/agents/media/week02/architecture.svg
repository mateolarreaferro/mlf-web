<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 690" role="img" aria-labelledby="title desc"><title id="title">Larry architecture — implementation reference</title><desc id="desc">Browser requests cross server authorization into a smolagents loop. The model selects tools over a working graph; Exa MCP supplies reference search. Durable state is held separately in Blob storage.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#79b3c5"/></marker></defs><rect width="1080" height="690" fill="#0d1419"/><g font-family="Arial,sans-serif"><text x="30" y="38" fill="#e0eaed" font-size="23">Larry · model, tools, state and boundaries</text><rect x="30" y="75" width="270" height="115" rx="12" fill="#19252c" stroke="#40535d"/><text x="46" y="103" fill="#e0eaed" font-size="17">Browser / 3D environment</text><text x="46" y="129" fill="#aabdc5" font-size="13">Larry conversation + original notes</text><text x="46" y="149" fill="#aabdc5" font-size="13">Local typing → lexical highlights</text><text x="46" y="169" fill="#aabdc5" font-size="13">Citations → source cards</text><rect x="370" y="75" width="320" height="115" rx="12" fill="#19252c" stroke="#40535d"/><text x="386" y="103" fill="#e0eaed" font-size="17">Next request boundary</text><text x="386" y="129" fill="#aabdc5" font-size="13">Public guest: read-only tools</text><text x="386" y="149" fill="#aabdc5" font-size="13">Editor: explicit indexing allowed</text><text x="386" y="169" fill="#aabdc5" font-size="13">Origin, input, rate and revision checks</text><rect x="760" y="75" width="290" height="115" rx="12" fill="#19252c" stroke="#40535d"/><text x="776" y="103" fill="#e0eaed" font-size="17">Durable state</text><text x="776" y="129" fill="#aabdc5" font-size="13">Source notes + derived graph</text><text x="776" y="149" fill="#aabdc5" font-size="13">Separate private Blob documents</text><text x="776" y="169" fill="#aabdc5" font-size="13">Server-controlled storage access</text><rect x="370" y="270" width="320" height="125" rx="12" fill="#19252c" stroke="#40535d"/><text x="386" y="298" fill="#e0eaed" font-size="17">Python harness</text><text x="386" y="324" fill="#aabdc5" font-size="13">smolagents ToolCallingAgent</text><text x="386" y="344" fill="#aabdc5" font-size="13">Choose tool → observe → decide</text><text x="386" y="364" fill="#aabdc5" font-size="13">18-step limit + final validation</text><rect x="30" y="270" width="270" height="125" rx="12" fill="#19252c" stroke="#40535d"/><text x="46" y="298" fill="#e0eaed" font-size="17">Model provider</text><text x="46" y="324" fill="#aabdc5" font-size="13">GPT-5.1 via LiteLLM</text><text x="46" y="344" fill="#aabdc5" font-size="13">Question + bounded conversation</text><text x="46" y="364" fill="#aabdc5" font-size="13">Tool schemas and observations</text><rect x="760" y="270" width="290" height="125" rx="12" fill="#19252c" stroke="#40535d"/><text x="776" y="298" fill="#e0eaed" font-size="17">Working state + skill</text><text x="776" y="324" fill="#aabdc5" font-size="13">Per-request SQLite graph</text><text x="776" y="344" fill="#aabdc5" font-size="13">Validated quotes and revisions</text><text x="776" y="364" fill="#aabdc5" font-size="13">load_skill → Markdown procedure</text><rect x="370" y="465" width="320" height="125" rx="12" fill="#19252c" stroke="#40535d"/><text x="386" y="493" fill="#e0eaed" font-size="17">Task-specific tools</text><text x="386" y="519" fill="#aabdc5" font-size="13">integrate_note → extraction receipt</text><text x="386" y="539" fill="#aabdc5" font-size="13">trace_thought → evidence + paths</text><text x="386" y="559" fill="#aabdc5" font-size="13">read_notes / attach_reference</text><rect x="760" y="465" width="290" height="125" rx="12" fill="#19252c" stroke="#40535d"/><text x="776" y="493" fill="#e0eaed" font-size="17">External MCP / Exa</text><text x="776" y="519" fill="#aabdc5" font-size="13">search_references → Exa MCP</text><text x="776" y="539" fill="#aabdc5" font-size="13">Bibliographic query → receipt</text><text x="776" y="559" fill="#aabdc5" font-size="13">Candidate URL, not verified reading</text><path d="M300 130H370" fill="none" stroke="#79b3c5" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M690 130H760" fill="none" stroke="#79b3c5" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M530 190V270" fill="none" stroke="#79b3c5" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M300 330H370" fill="none" stroke="#79b3c5" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M690 330H760" fill="none" stroke="#79b3c5" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M530 395V465" fill="none" stroke="#79b3c5" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M690 525H760" fill="none" stroke="#79b3c5" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="30" y="635" fill="#aabdc5" font-size="14">Tool permissions constrain actions; this is not an OS sandbox. No arbitrary code-execution tool.</text><text x="30" y="660" fill="#aabdc5" font-size="14">Local: Python subprocess. Hosted design: signed Next → Python request. AI-generated reference; review before submission.</text></g></svg>