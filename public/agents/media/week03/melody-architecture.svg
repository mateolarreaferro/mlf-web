<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4a46"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #2f2f2c; stroke-width: 1.5; rx: 10; }
      .soft { fill: #f3f1ec; stroke: #c9c5bb; stroke-width: 1.2; rx: 10; }
      .person { fill: #e3efe9; stroke: #3d7a63; stroke-width: 1.8; rx: 12; }
      .model { fill: #ece9f6; stroke: #5b4e9a; stroke-width: 1.5; rx: 10; }
      .tool { fill: #f6eddd; stroke: #a07326; stroke-width: 1.5; rx: 10; }
      .h { font-size: 19px; font-weight: 700; fill: #1d1d1b; }
      .t { font-size: 14.5px; fill: #2f2f2c; }
      .s { font-size: 12.5px; fill: #5c5a55; }
      .mono { font-family: "JetBrains Mono", Menlo, monospace; font-size: 12.5px; fill: #3b3a36; }
      .edge { stroke: #4a4a46; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .label { font-size: 12.5px; fill: #4a4a46; }
      .boundary { fill: none; stroke: #c0392b; stroke-width: 2.2; stroke-dasharray: 9 6; rx: 16; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#faf9f6"/>

  <text x="40" y="52" font-size="28" font-weight="700" fill="#1d1d1b">DrC Melody: a person and an agent arranging music together</text>
  <text x="40" y="80" class="s">Architecture and authority boundary, 2026-10-05. Diagram drawn by Claude (AI-made) from the code in drc-web; check it against the code before citing.</text>

  <!-- Person -->
  <rect x="40" y="110" width="300" height="250" class="person"/>
  <text x="60" y="142" class="h">Person</text>
  <text x="60" y="170" class="t">plays notes (computer keys,</text>
  <text x="60" y="190" class="t">on-screen keys, MIDI)</text>
  <text x="60" y="218" class="t">asks in words</text>
  <text x="60" y="246" class="t">sets authority: keep / polish / rewrite</text>
  <text x="60" y="274" class="t">pins notes, edits by hand</text>
  <text x="60" y="302" class="t">takes or leaves each layer</text>
  <text x="60" y="330" class="t">jams over the loop</text>

  <!-- Interface -->
  <rect x="400" y="110" width="520" height="250" class="box"/>
  <text x="420" y="142" class="h">Interface (browser, React)</text>
  <text x="420" y="170" class="t">Piano roll: the shared score. Outlined = yours,</text>
  <text x="420" y="190" class="t">filled = DrC, dashed = polished, dot = pinned,</text>
  <text x="420" y="210" class="t">ghost + line = where a note was before.</text>
  <text x="420" y="238" class="t">Analysis lane: DrC's key and one chord per bar.</text>
  <text x="420" y="266" class="t">Review panel: per-layer take/leave, play before/after.</text>
  <text x="420" y="294" class="t">Authorship meter: share of notes that are yours.</text>
  <text x="420" y="322" class="t">Session evidence: share over time, accept rate,</text>
  <text x="420" y="342" class="t">edits after accept, replays, JSON export.</text>

  <!-- State -->
  <rect x="980" y="110" width="580" height="250" class="soft"/>
  <text x="1000" y="142" class="h">State</text>
  <text x="1000" y="170" class="mono">arrangement</text><text x="1112" y="170" class="s">bpm, layers of notes {s, d, p, v, o, polished, pinned},</text>
  <text x="1112" y="188" class="s">analysis, designed sounds per layer</text>
  <text x="1000" y="216" class="mono">history</text><text x="1112" y="216" class="s">plain-language log the agent reads (accepted, rejected, edited)</text>
  <text x="1000" y="244" class="mono">turns</text><text x="1112" y="244" class="s">the agent conversation, compacted to the last 12</text>
  <text x="1000" y="272" class="mono">evidence log</text><text x="1112" y="272" class="s">one event per interaction, for the measures</text>
  <text x="1000" y="300" class="mono">undo stack</text><text x="1112" y="300" class="s">every change to the accepted arrangement</text>
  <text x="1000" y="334" class="s">Saved as a project (Supabase, row-level security), reopened by /melody?project=id</text>

  <!-- Harness with authority boundary -->
  <rect x="40" y="420" width="880" height="330" class="boundary"/>
  <text x="58" y="446" font-size="14" font-weight="700" fill="#c0392b">Authority boundary, enforced by the app</text>
  <rect x="64" y="462" width="400" height="270" class="box"/>
  <text x="84" y="492" class="h">Harness (pure, unit-tested)</text>
  <text x="84" y="520" class="mono">validateReply</text><text x="200" y="520" class="s">limits + authority + pins</text>
  <text x="84" y="546" class="mono">fixRequest</text><text x="200" y="546" class="s">broken rules back to DrC (x2)</text>
  <text x="84" y="572" class="mono">restoreYours</text><text x="200" y="572" class="s">last resort: puts notes back</text>
  <text x="84" y="598" class="mono">attribute</text><text x="200" y="598" class="s">origin computed, never trusted</text>
  <text x="84" y="624" class="mono">movedNotes</text><text x="200" y="624" class="s">the diff the roll draws</text>
  <text x="84" y="650" class="mono">validateJamReply</text><text x="222" y="650" class="s">answers stay in their own layer</text>
  <text x="84" y="676" class="mono">staticProblems</text><text x="210" y="676" class="s">designed-sound contract</text>
  <text x="84" y="710" class="s">Pinned notes: kept exactly in every mode.</text>

  <rect x="490" y="462" width="410" height="270" class="tool"/>
  <text x="510" y="492" class="h">Tools (Csound 7 in WebAssembly)</text>
  <text x="510" y="520" class="t">Live synth: one running instance, held keys,</text>
  <text x="510" y="540" class="t">designed instruments added with compileOrc.</text>
  <text x="510" y="568" class="t">Loop clock (instr 90): re-fires the loop table</text>
  <text x="510" y="588" class="t">each cycle on Csound's own clock; no drift.</text>
  <text x="510" y="616" class="t">checkCsd: compile, run 2 s muted, peak level,</text>
  <text x="510" y="636" class="t">errors back to the builder before anything plays.</text>
  <text x="510" y="664" class="t">Player: renders the accepted arrangement or</text>
  <text x="510" y="684" class="t">the proposal with only the layers taken.</text>
  <text x="510" y="712" class="s">7 preset instruments, master bus with tanh limiter.</text>

  <!-- Models -->
  <rect x="980" y="420" width="580" height="330" class="model"/>
  <text x="1000" y="452" class="h">Models (Claude, metered per call)</text>
  <text x="1000" y="484" class="mono">arranger</text><text x="1100" y="484" class="t">Claude Opus 5.5, structured JSON:</text>
  <text x="1100" y="504" class="s">{kind: proposal | question, message, analysis, layers}</text>
  <text x="1100" y="522" class="s">asks instead of breaking the authority setting</text>
  <text x="1000" y="556" class="mono">responder</text><text x="1100" y="556" class="t">Claude Sonnet 5.5, one short line per phrase</text>
  <text x="1100" y="576" class="s">about 3 s warm; reply lands at the next bar or cycle</text>
  <text x="1000" y="610" class="mono">builder</text><text x="1100" y="610" class="t">Claude Opus 5.5, designs one instrument body</text>
  <text x="1100" y="630" class="s">contract: p4 pitch, p5 amp, no p3, mixes to the bus</text>
  <text x="1000" y="668" class="s">Every call: auth, rate limit, hold credits for the worst case,</text>
  <text x="1000" y="688" class="s">stream NDJSON, settle to real token usage (meteredStream).</text>
  <text x="1000" y="716" class="s">Model ids live only in models.ts.</text>

  <!-- Edges -->
  <path d="M340,235 L400,235" class="edge"/>
  <path d="M920,235 L980,235" class="edge"/>
  <path d="M450,360 L450,455" class="edge"/>
  <text x="410" y="390" class="label" text-anchor="end">request + arrangement + history</text>
  <path d="M420,462 L420,367" class="edge"/>
  <text x="410" y="410" class="label" text-anchor="end">only a valid proposal reaches review</text>
  <path d="M700,462 L700,367" class="edge"/>
  <text x="708" y="400" class="label">sound</text>
  <path d="M264,734 L264,770 L1270,770 L1270,757" class="edge"/>
  <path d="M1270,770 L264,770" fill="none" stroke="none"/>
  <text x="560" y="764" class="label">turns to the models, replies back to the harness</text>

  <!-- State machine -->
  <rect x="40" y="790" width="1520" height="180" class="soft"/>
  <text x="60" y="820" class="h">Interaction states</text>
  <g font-size="14" fill="#1d1d1b">
    <rect x="60" y="845" width="150" height="40" rx="20" fill="#fff" stroke="#2f2f2c"/><text x="135" y="870" text-anchor="middle">waiting</text>
    <rect x="250" y="845" width="150" height="40" rx="20" fill="#fff" stroke="#2f2f2c"/><text x="325" y="870" text-anchor="middle">recording</text>
    <rect x="440" y="845" width="150" height="40" rx="20" fill="#e3efe9" stroke="#3d7a63"/><text x="515" y="870" text-anchor="middle">your turn</text>
    <rect x="660" y="845" width="170" height="40" rx="20" fill="#ece9f6" stroke="#5b4e9a"/><text x="745" y="870" text-anchor="middle">DrC arranging</text>
    <rect x="870" y="845" width="200" height="40" rx="20" fill="#fbe9e6" stroke="#c0392b"/><text x="970" y="870" text-anchor="middle">checking your rules</text>
    <rect x="1110" y="845" width="160" height="40" rx="20" fill="#e3efe9" stroke="#3d7a63"/><text x="1190" y="870" text-anchor="middle">your review</text>
    <rect x="440" y="915" width="150" height="40" rx="20" fill="#f6eddd" stroke="#a07326"/><text x="515" y="940" text-anchor="middle">jamming</text>
    <rect x="1310" y="845" width="220" height="40" rx="20" fill="#fff" stroke="#2f2f2c"/><text x="1420" y="870" text-anchor="middle">DrC asks (no change)</text>
  </g>
  <path d="M210,865 L250,865" class="edge"/>
  <path d="M400,865 L440,865" class="edge"/>
  <path d="M590,865 L660,865" class="edge"/><text x="598" y="858" class="label">ask</text>
  <path d="M830,865 L870,865" class="edge"/>
  <path d="M1070,865 L1110,865" class="edge"/>
  <path d="M1030,845 C1030,815 1420,815 1420,843" class="edge"/><text x="1190" y="812" class="label">question</text>
  <path d="M900,845 C890,826 790,826 780,843" class="edge"/><text x="772" y="822" class="label">broken rule: fix (x2)</text>
  <path d="M1190,885 C1190,935 650,935 592,878" class="edge"/><text x="860" y="945" class="label">accept / reject / revise</text>
  <path d="M515,885 L515,915" class="edge" marker-start="url(#arrow)"/>
  <text x="530" y="905" class="label">loop / stop</text>
  <text x="620" y="963" class="s">Hand edits, pins and undo happen in "your turn"; each is one undo step and one evidence event.</text>
</svg>
